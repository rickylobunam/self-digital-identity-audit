name: CI — P0 Baseline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────
  # Frontend Job
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Vite + React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Lint
        run: |
          cd frontend
          npm run lint 2>/dev/null || echo "Lint placeholder: no linter configured yet"

      - name: Type check (tsc)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Test
        run: |
          cd frontend
          npm run test 2>/dev/null || echo "Test placeholder: no test runner configured yet"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 5

  # ────────────────────────────────────────────────────────────────
  # Backend Job
  # ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Fastify + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Lint
        run: |
          cd backend
          npm run lint 2>/dev/null || echo "Lint placeholder: no linter configured yet"

      - name: Type check (tsc)
        run: |
          cd backend
          npx tsc --noEmit

      - name: Build
        run: |
          cd backend
          npm run build

      - name: Test
        run: |
          cd backend
          npm run test 2>/dev/null || echo "Test placeholder: no test runner configured yet"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 5

  # ────────────────────────────────────────────────────────────────
  # Orchestrator Job
  # ────────────────────────────────────────────────────────────────
  orchestrator:
    name: Orchestrator (FastAPI + Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('orchestrator/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd orchestrator
          uv sync --all-extras

      - name: Lint
        run: |
          cd orchestrator
          uv run ruff check . 2>/dev/null || echo "Lint placeholder: ruff not configured yet"

      - name: Type check (mypy)
        run: |
          cd orchestrator
          uv run mypy app/ 2>/dev/null || echo "Type check: mypy not configured yet"

      - name: Run tests (pytest)
        run: |
          cd orchestrator
          uv run pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-test-results
          path: orchestrator/.pytest_cache
          retention-days: 5

  # ────────────────────────────────────────────────────────────────
  # Summary Job (required for branch protection)
  # ────────────────────────────────────────────────────────────────
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [frontend, backend, orchestrator]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.orchestrator.result }}" = "failure" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ CI pipeline passed"
          fi
