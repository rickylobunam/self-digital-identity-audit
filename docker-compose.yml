services:
  # ── Cosmos DB Emulator ──────────────────────────────────────────────
  # ── Cosmos DB Emulator ──────────────────────────────────────────────
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: sdia-cosmos
    ports:
      - "8081:8081"
      - "10251:10251"
      - "10252:10252"
      - "10253:10253"
      - "10254:10254"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=1
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  # ── Azurite (Azure Blob Storage emulator) ──────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: sdia-azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

  # ── Mailhog (captures emails in development) ───────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sdia-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI → http://localhost:8025

  # ── Backend (Node.js Fastify) ───────────────────────────────────────
  backend:
    image: node:22-bookworm-slim
    container_name: sdia-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - COSMOS_ENDPOINT=https://cosmos-emulator:8081
      - COSMOS_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMcZcLU==
      - COSMOS_DB_NAME=sdia
      - COSMOS_CONTAINER=audit-jobs
      - ACS_CONNECTION_STRING=endpoint=http://mailhog:1025;
      - JWT_SECRET=dev-secret-not-for-production
      - ALLOWED_ORIGINS=http://localhost:5173
      - RATE_LIMIT_MAX=10
      - NODE_TLS_REJECT_UNAUTHORIZED=0  # Cosmos emulator uses self-signed cert
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      cosmos-emulator:
        condition: service_healthy
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Frontend (Vite React) ───────────────────────────────────────────
  frontend:
    image: node:22-bookworm-slim
    container_name: sdia-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Orchestrator (Python FastAPI) — local testing only ─────────────
  orchestrator:
    image: python:3.11-slim-bookworm
    container_name: sdia-orchestrator
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=gpt-4o-mini
      - COSMOS_ENDPOINT=https://cosmos-emulator:8081
      - COSMOS_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMcZcLU==
      - BLOB_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UKvz1KFGVcZOTCgb=;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - PDF_OWNER_SECRET=dev-owner-secret
      - USE_LLM_MOCK=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    working_dir: /app
    volumes:
      - ./orchestrator:/app
    depends_on:
      cosmos-emulator:
        condition: service_healthy
      azurite:
        condition: service_started
    command: sh -c "pip install uv && uv sync --all-extras && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3);\""
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - orchestrator  # Only started with: docker compose --profile orchestrator up

volumes:
  backend_node_modules:
  frontend_node_modules:

networks:
  default:
    name: sdia-network
